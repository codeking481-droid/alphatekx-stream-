<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alphatekx Stream — Mini YouTube but Better</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><polygon points=%2250,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5%22 fill=%22none%22 stroke=%22%2300FF88%22 stroke-width=%228%22/><circle cx=%2250%22 cy=%2250%22 r=%2214%22 fill=%22%2300D9FF%22/></svg>">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Alphatekx Stream - Dark futuristic streaming platform with AI Summaries, Naija Translator, Enhanced Cinema Mode, Live Community Chat, Marketplace & AI Memory Chat.">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              black: '#000000',
              blue: '#00D9FF',
              green: '#00FF88',
              purple: '#A855F7',
              darkcard: 'rgba(15, 15, 20, 0.75)'
            }
          },
          fontFamily: {
            sans: ['Roboto', 'system-ui', 'sans-serif'],
          },
          animation: {
            'glow-pulse': 'glowPulse 3s ease-in-out infinite',
            'fade-in': 'fadeIn 0.3s ease-out forwards',
          },
          keyframes: {
            glowPulse: {
              '0%, 100%': { boxShadow: '0 0 15px rgba(0, 217, 255, 0.3)' },
              '50%': { boxShadow: '0 0 30px rgba(0, 255, 136, 0.5)' },
            },
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(6px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
  
  <!-- Roboto Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: 'Roboto', sans-serif;
      overflow-x: hidden;
    }
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #000000;
    }
    ::-webkit-scrollbar-thumb {
      background: #262626;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00D9FF;
    }
    .glass-card {
      background: rgba(12, 12, 16, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
    }
    .neon-border-blue {
      border: 1px solid #00D9FF;
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.25);
    }
    .neon-border-green {
      border: 1px solid #00FF88;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.25);
    }
  </style>

  <!-- Import Map for React -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
    }
  }
  </script>
  <!-- Babel Standalone for inline JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-black text-white min-h-screen selection:bg-[#00D9FF] selection:text-black">
  <div id="root"></div>

  <script type="text/babel" data-type="module" data-presets="react" src="./app.jsx"></script>
</body>
</html>
